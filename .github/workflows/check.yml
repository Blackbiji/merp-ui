name: MERP-UI release validation

on:
  pull_request:
  push:
    branches: [main, staging/wolf-warg-lore-vf-en-20261121]

jobs:
  release-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialise Wolf and Warg Lore, then rebuild all eleven LevelDB packs offline
        env:
          CI: 'true'
          MERPUI_OFFLINE_PACK_COMPACTION: '1'
        run: |
          npm install --no-save --no-package-lock classic-level@2.0.0 @foundryvtt/foundryvtt-cli@3.0.4
          node tools/publication/upgrade-wolf-lore-2.0.11.mjs
          node tools/publication/upgrade-warg-lore-2.0.12.mjs
          node tools/publication/build-creature-folders.mjs
          node tools/publication/build-creature-actors.mjs
          node tools/publication/consolidate-creature-lore.mjs
          node tools/publication/upgrade-wolf-lore-bilingual-2.0.18.mjs
          npm run compact:packs:offline
      - name: Validate the two Creature Actors, their Lore buttons and bestiary folders
        run: npm run test:creatures
      - name: Verify a single RollTable per species and all Lore families
        run: npm run test:creature-lore
      - name: Official Foundry CLI extract-and-reconstruct test (2 Actors, 55 Items, 2 Tables, 1055 results)
        run: npm run verify:foundry-pack
      - name: JavaScript syntax
        run: find scripts tools/publication -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n 1 node --check
      - name: Character identity compaction regression tests
        run: npm run test:identity
      - name: Talents step and Compendium typography tests
        run: npm run test:ui
      - name: Actor Talents and Flaws compact preview regression tests
        run: npm run test:talent-sheet
      - name: Native RMU racial size regression tests
        run: npm run test:racial-size
      - name: Validate 11 LevelDB Compendiums and bilingual sources
        run: npm run validate:release
      - name: Build Foundry-installable release ZIP
        run: npm run build:release
      - name: Archive lossless compendium audit report
        uses: actions/upload-artifact@v4
        with:
          name: merp-ui-compendium-audit
          path: dist/leveldb-compaction-report.json
          retention-days: 30
      - name: Archive release candidate for inspection
        uses: actions/upload-artifact@v4
        with:
          name: merp-ui-release-candidate
          path: dist/merp-ui-*.zip
          retention-days: 14
          compression-level: 0

  publish-v209:
    name: Publish MERP-UI 2.0.9
    needs: release-consistency
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release MERP-UI 2.0.9') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: merp-ui-release-candidate
          path: dist
      - name: Publish verified ZIP as official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s dist/merp-ui-2.0.9.zip
          if gh release view v2.0.9 >/dev/null 2>&1; then
            echo 'Release v2.0.9 already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create v2.0.9 dist/merp-ui-2.0.9.zip \
            --title 'MERP-UI 2.0.9' \
            --notes-file docs/RELEASE-2.0.9.md \
            --target "$GITHUB_SHA" \
            --latest
