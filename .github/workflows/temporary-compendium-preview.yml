name: MERP-RMU compendium appearance preview
on:
  push:
    branches: [feature/compendium-journal-appearance-rc5]
    paths:
      - .github/workflows/temporary-compendium-preview.yml
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runtime syntax and content integrity
        run: |
          node --check scripts/merp-ui.js
          npm run validate:content-sync
      - name: Build two-file cosmetic patch
        run: |
          git archive --format=zip --prefix=merp-ui/ -o MERP-UI-RC5-PATCH-APPARENCE-COMPENDIUMS.zip HEAD scripts/merp-ui.js styles/merp-theme.css
          unzip -t MERP-UI-RC5-PATCH-APPARENCE-COMPENDIUMS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MERP-UI-RC5-PATCH-APPARENCE-COMPENDIUMS
          path: MERP-UI-RC5-PATCH-APPARENCE-COMPENDIUMS.zip
          if-no-files-found: error
