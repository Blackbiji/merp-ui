name: MERP-UI 2.0 validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  release-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: find scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n 1 node --check
      - name: Validate distribution, 9 Compendiums, 455 source hashes, and FR/EN content
        run: npm run validate:release
