name: Herb biome help preview patch
# Preview build 3: historical herb codes / Creature Law distinction.
on:
  push:
    branches: [feature/herb-biome-tooltips]
    paths:
      - .github/workflows/herb-biome-preview.yml
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test bilingual habitat codes
        run: npm run test:herb-biomes
      - name: Create additive three-file patch
        run: |
          git archive --format=zip --prefix=merp-ui/ -o MERP-UI-RC4-PATCH-HERB-BIOME-HELP-FR-EN.zip HEAD scripts/merp-ui.js scripts/merp-rmu/herb-biomes.js styles/merp-theme.css
          unzip -t MERP-UI-RC4-PATCH-HERB-BIOME-HELP-FR-EN.zip
          unzip -Z1 MERP-UI-RC4-PATCH-HERB-BIOME-HELP-FR-EN.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MERP-UI-RC4-PATCH-HERB-BIOME-HELP-FR-EN
          path: MERP-UI-RC4-PATCH-HERB-BIOME-HELP-FR-EN.zip
          if-no-files-found: error
          retention-days: 30
