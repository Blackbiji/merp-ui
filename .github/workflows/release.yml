name: Publish MERP-UI release

# This release can be published directly from the validated merge into main.
# The GitHub connector cannot create Git tags; this workflow creates the
# annotated tag itself using the repository's permitted GITHUB_TOKEN.
# Tags pushed with GITHUB_TOKEN do not trigger a second workflow run; the
# same job therefore builds and publishes the ZIP.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine intended release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('module.json', 'utf8')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "Tag/version mismatch"; exit 1; }
          fi
          # Publish a versioned MERP-ui release directly from main.
          test "$VERSION" = "2.0.19" || { echo "Unexpected version $VERSION"; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version v$VERSION already published; no release changes made."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild Wolf and Warg Lore, then compact all eleven LevelDB packs offline
        if: steps.version.outputs.publish == 'true'
        env:
          CI: 'true'
          MERPUI_OFFLINE_PACK_COMPACTION: '1'
        run: |
          npm install --no-save --no-package-lock classic-level@2.0.0 @foundryvtt/foundryvtt-cli@3.0.4
          node tools/publication/upgrade-wolf-lore-2.0.11.mjs
          node tools/publication/upgrade-warg-lore-2.0.12.mjs
          node tools/publication/build-creature-folders.mjs
          node tools/publication/build-creature-actors.mjs
          node tools/publication/consolidate-creature-lore.mjs
          node tools/publication/upgrade-wolf-lore-bilingual-2.0.19.mjs
          npm run compact:packs:offline

      - name: Validate the two Creature Actors, their Lore buttons and bestiary folders
        if: steps.version.outputs.publish == 'true'
        run: npm run test:creatures
      - name: Verify a single RollTable per species and all Lore families
        if: steps.version.outputs.publish == 'true'
        run: npm run test:creature-lore
      - name: Official Foundry CLI extract-and-reconstruct test (2 Actors, 55 Items, 2 Tables, 1055 results)
        if: steps.version.outputs.publish == 'true'
        run: npm run verify:foundry-pack
      - name: Validate JavaScript syntax
        if: steps.version.outputs.publish == 'true'
        run: find scripts tools/publication -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n 1 node --check
      - name: Test lightweight identity creation
        if: steps.version.outputs.publish == 'true'
        run: npm run test:identity
      - name: Talents step and Compendium typography regression tests
        if: steps.version.outputs.publish == 'true'
        run: npm run test:ui
      - name: Actor Talents and Flaws compact preview regression tests
        if: steps.version.outputs.publish == 'true'
        run: npm run test:talent-sheet
      - name: Native RMU racial size regression tests
        if: steps.version.outputs.publish == 'true'
        run: npm run test:racial-size
      - name: Validate distribution and 11 LevelDB Compendiums
        if: steps.version.outputs.publish == 'true'
        run: npm run validate:release
      - name: Build complete Foundry release ZIP
        if: steps.version.outputs.publish == 'true'
        run: npm run build:release
      - name: SHA-256
        if: steps.version.outputs.publish == 'true'
        run: sha256sum dist/merp-ui-*.zip
      - name: Archive compendium content/size audit
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: merp-ui-leveldb-lossless-audit
          path: dist/leveldb-compaction-report.json
          retention-days: 30

      - name: Archive installable ZIP
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: merp-ui-installable-zip
          path: dist/merp-ui-*.zip
          retention-days: 30
          compression-level: 0

      - name: Create official v2.0.19 annotated tag on main
        if: steps.version.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" || {
              echo "Existing tag does not match the merged HEAD"; exit 1;
            }
          else
            git tag -a "$TAG" -m "MERP-ui $VERSION — Creature Lore VO/VF and Culture synchronisation"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish complete ZIP to GitHub Releases
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          ZIP="dist/merp-ui-$VERSION.zip"
          test -s "$ZIP"
          gh release create "$TAG" "$ZIP" \
            --title "MERP-ui $VERSION — Creature Lore VO/VF and Culture synchronisation" \
            --notes-file ".github/release-notes/v2.0.19.md" \
            --latest \
            --verify-tag
          gh release view "$TAG" --json url,assets

      - name: Remove superseded temporary branch after successful release
        if: steps.version.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="fix/creature-lore-window-theme-i18n-20261121"
          # Only the temporary branch created for this test, not unrelated WIP.
          gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" \
            || echo "Temporary branch absent or already deleted"
