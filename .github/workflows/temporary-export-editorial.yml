name: Temporary RC5 working tree export
on:
  push:
    branches: [feature/talents-editorial-rc5]
    paths:
      - .github/workflows/temporary-export-editorial.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create precise source snapshot
        run: |
          git archive --format=zip --prefix=merp-ui/ -o merp-ui-rc5-branch-source.zip HEAD
          unzip -t merp-ui-rc5-branch-source.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: merp-ui-rc5-branch-source
          path: merp-ui-rc5-branch-source.zip
          if-no-files-found: error
